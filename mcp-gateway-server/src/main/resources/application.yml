server:
  port: 8082

spring:
  application:
    name: mcp-gateway
  datasource:
    # PostgreSQL. Override via env: DB_URL / DB_USERNAME / DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcp_gateway}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Schema is managed by the checked-in DDL (db/schema.sql), not by Hibernate.
      # Temporarily set to "update" only when bootstrapping a dev database.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  ai:
    mcp:
      server:
        # Auto-configured single MCP server is disabled: the gateway mounts one MCP
        # server per configured McpServerEntity at /mcp/{name}/... (see McpServerManager).
        enabled: false
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

logging:
  level:
    com.aura.mcp.gateway: debug
