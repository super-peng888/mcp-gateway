# MCP Gateway — one-command deployment.
#
# Prerequisite: build the backend jar on the host first (containers in this
# environment cannot reach Maven Central):
#   cd mcp-gateway-server && mvn clean package -DskipTests
#
# Then:
#   docker compose up --build -d
#
# UI:        http://localhost:8080
# Backend:   http://localhost:8082  (management API + MCP endpoints)
# PostgreSQL schema is created on first start from db/schema.sql
# (mounted into /docker-entrypoint-initdb.d). To reset the database:
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start with an empty data volume.
      - ./mcp-gateway-server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Exposed for local tooling; remove in production.
      - "${PG_PORT:-5432}:5432"

  server:
    build: ./mcp-gateway-server
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mcp_gateway
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Optional: enables the in-UI chat test page when set to a real key.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8082}:8082"

  ui:
    build: ./mcp-gateway-ui
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
